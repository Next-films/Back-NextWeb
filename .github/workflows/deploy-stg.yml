name: Deploy Back-NextWeb to DEV

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
      SSH_USERNAME: ${{ secrets.DEV_SSH_USERNAME }}
      SSHPASS: ${{ secrets.DEV_SSH_PASSWORD }}
      SSH_OPTS: -o StrictHostKeyChecking=yes
      REMOTE_PATH: /home/deploy/Back-NextWeb
      GIT_REPO: https://github.com/Next-films/Back-NextWeb.git
      GIT_USERNAME: ${{ secrets.BACK_GIT_USERNAME }}
      DEFAULT_ADMIN_EMAIL: ${{ secrets.DEFAULT_ADMIN_EMAIL }}
      DEFAULT_ADMIN_PASSWORD: ${{ secrets.DEFAULT_ADMIN_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts || true

      - name: Check SSH reachability
        run: |
          echo "Using SSH_HOST=$SSH_HOST"
          nc -vz -w 5 "$SSH_HOST" "$SSH_PORT"

      - name: Deploy on server
        run: |
          sshpass -e ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" << EOF
          set -e
          mkdir -p "$REMOTE_PATH"

          if [ ! -d "$REMOTE_PATH/.git" ]; then
            git clone "$GIT_REPO" "$REMOTE_PATH"
          fi

          cd "$REMOTE_PATH"

          git remote set-url origin "https://$GIT_USERNAME:${{ secrets.BACK_GIT_TOKEN }}@github.com/Next-films/Back-NextWeb.git"
          git fetch --prune origin
          git checkout dev
          git pull --ff-only origin dev

          docker build -t nextfilms/cinema-app:dev .

          BACK_CONTAINERS=\$(docker ps -a --format '{{.ID}} {{.Names}}' | awk '\$2 ~ /back-nextweb|cinema-app/ {print \$1}')
          if [ -n "\$BACK_CONTAINERS" ]; then
            docker rm -f \$BACK_CONTAINERS || true
          fi

          CONTAINERS_ON_4000=\$(docker ps -a --format '{{.ID}} {{.Ports}}' | awk '\$0 ~ /:4000->/ {print \$1}')
          if [ -n "\$CONTAINERS_ON_4000" ]; then
            docker rm -f \$CONTAINERS_ON_4000 || true
          fi

          if [ -f .env.staging ]; then
            ENV_FILE=.env.staging
          elif [ -f .env ]; then
            ENV_FILE=.env
          else
            cp .env.example .env.staging
            ENV_FILE=.env.staging
          fi

          docker run -d --name back-nextweb --restart unless-stopped \
            --env-file "\$ENV_FILE" \
            -e ENV=STAGING \
            -p 4000:4000 \
            nextfilms/cinema-app:dev

          sleep 5

          ADMIN_EMAIL="\${DEFAULT_ADMIN_EMAIL:-email@mail.ru}"
          ADMIN_PASSWORD="\${DEFAULT_ADMIN_PASSWORD:-Admin123456&}"

          POSTGRES_URL_VALUE=\$(grep -E '^POSTGRES_URL=' "\$ENV_FILE" | head -n1 | cut -d= -f2- || true)
          if [ -n "\$POSTGRES_URL_VALUE" ]; then
            docker run --rm postgres:15 sh -lc "
              psql \"\$POSTGRES_URL_VALUE\" -v ON_ERROR_STOP=1 -v admin_email=\"\$ADMIN_EMAIL\" \
                -c \"INSERT INTO admin_roles_admin_role(\\\"adminId\\\",\\\"adminRoleId\\\")
                    SELECT a.id, r.id
                    FROM admin a, admin_role r
                    WHERE a.email = :'admin_email' AND r.name='admin'
                    ON CONFLICT DO NOTHING;\"
            "
          else
            echo \"POSTGRES_URL not found in \$ENV_FILE, skip role bootstrap via DB\"
          fi

          LOGIN_RESPONSE=\$(curl -sS -X POST "http://127.0.0.1:4000/api/admin/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"\$ADMIN_EMAIL\",\"password\":\"\$ADMIN_PASSWORD\"}")
          ACCESS_TOKEN=\$(echo "\$LOGIN_RESPONSE" | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p')
          if [ -z "\$ACCESS_TOKEN" ]; then
            echo "Default admin login failed"
            echo "\$LOGIN_RESPONSE"
            exit 1
          fi

          ME_RESPONSE=\$(curl -sS "http://127.0.0.1:4000/api/admin/auth/me" \
            -H "Authorization: Bearer \$ACCESS_TOKEN")
          echo "\$ME_RESPONSE" | grep -q '"admin"' || {
            echo "Default admin does not have admin role after deploy bootstrap"
            echo "\$ME_RESPONSE"
            exit 1
          }
          EOF
