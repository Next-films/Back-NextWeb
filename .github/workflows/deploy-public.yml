name: Deploy isolated public backend
on:
  workflow_dispatch:
    inputs:
      cinema_status:
        description: 'keep = deploy backend; stop/run = only toggle the public frontend'
        type: choice
        default: keep
        options: [keep, stop, run]
  push:
    branches: [dev]
concurrency:
  group: deploy-public-backend
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.cinema_status == 'keep'
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.PUBLIC_SSH_PASSWORD }}
      SSH_HOST: ${{ secrets.PUBLIC_SSH_HOST }}
      SSH_PORT: ${{ secrets.PUBLIC_SSH_PORT }}
      SSH_USER: ${{ secrets.PUBLIC_SSH_USERNAME }}
      SSH_KNOWN_HOSTS: ${{ secrets.PUBLIC_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Test isolation
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: yarn install --frozen-lockfile
      - run: yarn test --runTestsByPath src/public/public-runtime.spec.ts src/public/public-country-policy.spec.ts src/common/utils/public-content-policy.spec.ts src/modules/external-api/vibix/application/vibix-catalog.service.spec.ts src/modules/banner/application/external-banner.service.spec.ts
      - name: Build public-only image
        run: docker build -f Dockerfile.public --label org.opencontainers.image.revision="$GITHUB_SHA" -t "next-public-backend:isolated-$GITHUB_SHA" .
      - name: Deploy only to public host
        run: |
          test "$SSH_HOST" = '45.9.117.71'
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          docker save "next-public-backend:isolated-$GITHUB_SHA" | gzip -1 | sshpass -e ssh -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'gzip -d | docker load'
          sshpass -e ssh -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "/opt/next-public/deploy-image.sh backend '$GITHUB_SHA'"
  maintenance:
    if: github.event_name == 'workflow_dispatch' && inputs.cinema_status != 'keep'
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.PUBLIC_SSH_PASSWORD }}
      SSH_HOST: ${{ secrets.PUBLIC_SSH_HOST }}
      SSH_PORT: ${{ secrets.PUBLIC_SSH_PORT }}
      SSH_USER: ${{ secrets.PUBLIC_SSH_USERNAME }}
      SSH_KNOWN_HOSTS: ${{ secrets.PUBLIC_SSH_KNOWN_HOSTS }}
      CINEMA_STATUS_CHANGE: ${{ inputs.cinema_status }}
    steps:
      - uses: actions/checkout@v4
      - name: Set public frontend runtime mode
        run: |
          test "$SSH_HOST" = '45.9.117.71'
          case "$CINEMA_STATUS_CHANGE" in stop|run) ;; *) exit 2 ;; esac
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          sshpass -e ssh -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'test -d /opt/next-public && if ! test -f /opt/next-public/deploy-image.before-maintenance; then cp -p /opt/next-public/deploy-image.sh /opt/next-public/deploy-image.before-maintenance; fi'
          sshpass -e ssh -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'install -m 750 /dev/stdin /opt/next-public/deploy-image.sh' < deploy/public/deploy-image.sh
          sshpass -e ssh -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "python3 - '$CINEMA_STATUS_CHANGE'" < deploy/public/set-cinema-status.py
