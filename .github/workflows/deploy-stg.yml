name: Deploy cinema service to STG

on:
  push:
    branches:
      - dev

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sa
          POSTGRES_DB: next_films
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dotenv-cli
        run: yarn global add dotenv-cli

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "⏳ Waiting for Postgres..."
            sleep 1
          done

      - name: Wait for RabbitMQ
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:15672 > /dev/null; then
              echo "✅ RabbitMQ is up!"
              break
            fi
            echo "⏳ Waiting for RabbitMQ..."
            sleep 2
          done

      - name: Run tests with .env.test
        run: dotenv -e .env.test -- yarn test --runInBand

  deploy:
    name: Deploy to STG
    runs-on: ubuntu-latest
    needs: test

    env:
      COMPOSE_FILE: docker-compose.dev.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.DEV_SSH_PORT }} -H ${{ secrets.DEV_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy .env.example as .env
        run: cp .env.example .env

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build Docker image
        run: docker compose -f $COMPOSE_FILE --env-file .env build

      - name: Tag image for Docker Hub
        run: |
          image=$(docker compose -f $COMPOSE_FILE config | grep "image:" | awk '{print $2}')
          docker tag $image nextfilms/cinema-app:latest

      - name: Push image to Docker Hub
        run: docker push nextfilms/cinema-app:latest

      - name: Save image as tar
        run: |
          mkdir -p images
          docker save nextfilms/cinema-app:latest -o images/app.tar

      - name: Transfer image, .env and compose file to remote server
        run: |
          ssh -p ${{ secrets.DEV_SSH_PORT }} ${{ secrets.DEV_SSH_USERNAME }}@${{ secrets.DEV_SSH_HOST }} "mkdir -p ${{ secrets.DEV_REMOTE_PATH }}/upload"
          scp -P ${{ secrets.DEV_SSH_PORT }} images/app.tar ${{ secrets.DEV_SSH_USERNAME }}@${{ secrets.DEV_SSH_HOST }}:${{ secrets.DEV_REMOTE_PATH }}/upload/app.tar
          scp -P ${{ secrets.DEV_SSH_PORT }} .env ${{ secrets.DEV_SSH_USERNAME }}@${{ secrets.DEV_SSH_HOST }}:${{ secrets.DEV_REMOTE_PATH }}/.env
          scp -P ${{ secrets.DEV_SSH_PORT }} docker-compose.dev.yml ${{ secrets.DEV_SSH_USERNAME }}@${{ secrets.DEV_SSH_HOST }}:${{ secrets.DEV_REMOTE_PATH }}/docker-compose.dev.yml

      - name: Load image and restart docker compose remotely
        run: |
          ssh -p ${{ secrets.DEV_SSH_PORT }} ${{ secrets.DEV_SSH_USERNAME }}@${{ secrets.DEV_SSH_HOST }} << EOF
            cd ${{ secrets.DEV_REMOTE_PATH }}
            docker load -i upload/app.tar
            docker compose -f docker-compose.dev.yml --env-file .env down
            docker compose -f docker-compose.dev.yml --env-file .env up -d --remove-orphans
            rm upload/app.tar
          EOF