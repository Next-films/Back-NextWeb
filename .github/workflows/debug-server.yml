name: Debug DEV server state

on:
  push:
    branches:
      - dev

jobs:
  debug:
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
      SSH_OPTS: -o StrictHostKeyChecking=no
      SSHPASS: ${{ secrets.DEV_SSH_PASSWORD }}

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Collect server diagnostics
        run: |
          sshpass -e ssh $SSH_OPTS -p ${{ secrets.DEV_SSH_PORT }} \
            ${{ secrets.DEV_SSH_USERNAME }}@$SSH_HOST 'bash -s' << 'EOF'
          echo "===== env DB settings (no secrets) ====="
          grep -E "^(POSTGRES_HOST|POSTGRES_PORT|POSTGRES_DB|POSTGRES_USER)=" /home/deploy/dev/secrets-next/.env.back 2>/dev/null || true
          grep -E "^(POSTGRES_HOST|POSTGRES_PORT|POSTGRES_DB|POSTGRES_USER)=" /home/deploy/dev/secrets-next/.env.download 2>/dev/null || true
          ls /home/deploy/dev/secrets-next/ 2>/dev/null || true
          echo "===== local postgres containers: databases ====="
          docker exec postgres_migrated_next sh -c 'psql -U postgres -lqt 2>/dev/null | cut -d"|" -f1' 2>/dev/null | head -15 || true
          echo "--- postgres (5444):"
          docker exec postgres sh -c 'psql -U postgres -lqt 2>/dev/null | cut -d"|" -f1' 2>/dev/null | head -15 || true
          echo "===== can server reach 185.154.193.41:5432? ====="
          timeout 5 bash -c '</dev/tcp/185.154.193.41/5432' 2>/dev/null && echo "5432 reachable" || echo "5432 NOT reachable"
          echo "===== download-service-dev logs tail ====="
          docker logs --tail 60 next-download-service-dev 2>&1 | tail -30 || true
          EOF
