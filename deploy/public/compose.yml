name: next-public
services:
  public-backend:
    image: next-public-backend:isolated-v1
    container_name: next-public-backend
    restart: unless-stopped
    env_file: .env.backend
    ports:
      - "127.0.0.1:4000:4000"
    networks: [public]
    mem_limit: 512m
    cpus: 0.5
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  public-front:
    image: next-public-front:isolated-v1
    container_name: next-public-front
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_APP_ROLE: public
      NEXT_PUBLIC_API_BASE_URL: /api
      API_BASE_URL: http://public-backend:4000/api
      API_PROXY_TARGET: http://public-backend:4000
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    networks: [public]
    depends_on:
      public-backend: {condition: service_healthy}
    mem_limit: 768m
    cpus: 0.75
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  public:
    name: next-public-net
