name: Deploy Back-NextWeb to DEV

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
      SSH_USERNAME: ${{ secrets.DEV_SSH_USERNAME }}
      SSHPASS: ${{ secrets.DEV_SSH_PASSWORD }}
      SSH_OPTS: -o StrictHostKeyChecking=yes
      REMOTE_PATH: /home/deploy/Back-NextWeb
      GIT_REPO: https://github.com/Next-films/Back-NextWeb.git
      GIT_USERNAME: ${{ secrets.BACK_GIT_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts || true

      - name: Check SSH reachability
        run: |
          echo "Using SSH_HOST=$SSH_HOST"
          nc -vz -w 5 "$SSH_HOST" "$SSH_PORT"

      - name: Deploy on server
        run: |
          sshpass -e ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" << EOF
          set -e
          mkdir -p "$REMOTE_PATH"

          if [ ! -d "$REMOTE_PATH/.git" ]; then
            git clone "$GIT_REPO" "$REMOTE_PATH"
          fi

          cd "$REMOTE_PATH"

          git remote set-url origin "https://$GIT_USERNAME:${{ secrets.BACK_GIT_TOKEN }}@github.com/Next-films/Back-NextWeb.git"
          git fetch --prune origin
          git checkout dev
          git pull --ff-only origin dev

          docker build -t nextfilms/cinema-app:dev .

          BACK_CONTAINERS=\$(docker ps -a --format '{{.ID}} {{.Names}}' | awk '\$2 ~ /back-nextweb|cinema-app/ {print \$1}')
          if [ -n "\$BACK_CONTAINERS" ]; then
            docker rm -f \$BACK_CONTAINERS || true
          fi

          CONTAINERS_ON_4000=\$(docker ps -a --format '{{.ID}} {{.Ports}}' | awk '\$0 ~ /:4000->/ {print \$1}')
          if [ -n "\$CONTAINERS_ON_4000" ]; then
            docker rm -f \$CONTAINERS_ON_4000 || true
          fi

          if [ -f .env.staging ]; then
            ENV_FILE=.env.staging
          elif [ -f .env ]; then
            ENV_FILE=.env
          else
            cp .env.example .env.staging
            ENV_FILE=.env.staging
          fi

          docker run -d --name back-nextweb --restart unless-stopped \
            --env-file "\$ENV_FILE" \
            -e ENV=STAGING \
            -p 4000:4000 \
            nextfilms/cinema-app:dev

          sleep 5

          HEALTH_CODE=\$(curl -s -o /tmp/back-health.txt -w "%{http_code}" "http://127.0.0.1:4000/api/admin/auth/me" || true)
          if [ "\$HEALTH_CODE" != "401" ] && [ "\$HEALTH_CODE" != "200" ]; then
            echo "Back-NextWeb health check failed. HTTP \$HEALTH_CODE"
            cat /tmp/back-health.txt || true
            exit 1
          fi
          EOF
