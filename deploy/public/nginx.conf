server {
    listen 80;
    server_name next-films.ru www.next-films.ru server.next-films.ru;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name next-films.ru www.next-films.ru;
    ssl_certificate /etc/letsencrypt/live/next-public/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/next-public/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }
}

server {
    listen 443 ssl;
    server_name server.next-films.ru;
    ssl_certificate /etc/letsencrypt/live/next-public/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/next-public/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }
    location / { return 404; }
}
