name: Debug DEV server state

on:
  push:
    branches:
      - dev

jobs:
  debug:
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
      SSH_OPTS: -o StrictHostKeyChecking=no
      SSHPASS: ${{ secrets.DEV_SSH_PASSWORD }}

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Collect server diagnostics
        run: |
          sshpass -e ssh $SSH_OPTS -p ${{ secrets.DEV_SSH_PORT }} \
            ${{ secrets.DEV_SSH_USERNAME }}@$SSH_HOST 'bash -s' << 'EOF'
          echo "===== POSTGRES_URL in env files (credentials masked) ====="
          for f in /home/deploy/dev/secrets-next/.env.back /home/deploy/dev/secrets-next/.env.download; do
            echo "--- $f:"
            grep -E "^POSTGRES_URL=" "$f" 2>/dev/null | sed -E 's#//[^@]*@#//***:***@#' || echo "(no POSTGRES_URL)"
          done
          echo "===== postgres_migrated_next: env user and databases ====="
          PGUSER=$(docker exec postgres_migrated_next env 2>/dev/null | grep -E "^POSTGRES_USER=" | cut -d= -f2)
          echo "container user: ${PGUSER:-<empty>}"
          docker exec postgres_migrated_next psql -U "${PGUSER:-postgres}" -l 2>&1 | head -15 || true
          echo "===== postgres (5444): env user and databases ====="
          PGUSER2=$(docker exec postgres env 2>/dev/null | grep -E "^POSTGRES_USER=" | cut -d= -f2)
          echo "container user: ${PGUSER2:-<empty>}"
          docker exec postgres psql -U "${PGUSER2:-postgres}" -l 2>&1 | head -15 || true
          echo "===== actual env inside back container (db-related, masked) ====="
          docker exec next-back-nextweb-dev env 2>/dev/null | grep -E "^POSTGRES" | sed -E 's#//[^@]*@#//***:***@#; s#^(POSTGRES_PASSWORD)=.*#\1=***#' || true
          EOF
