# Old host only: do not proxy public requests across contours.
server {
    listen 80;
    server_name next-films.ru www.next-films.ru server.next-films.ru;
    default_type text/plain;
    return 410 "Public site has moved. Refresh your DNS cache.\n";
}
server {
    listen 443 ssl;
    server_name next-films.ru www.next-films.ru;
    ssl_certificate /etc/letsencrypt/live/next-films.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/next-films.ru/privkey.pem;
    default_type text/plain;
    return 410 "Public site has moved. Refresh your DNS cache.\n";
}
server {
    listen 443 ssl;
    server_name server.next-films.ru;
    ssl_certificate /etc/letsencrypt/live/server.next-films.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.next-films.ru/privkey.pem;
    default_type text/plain;
    return 410 "Public API has moved. Refresh your DNS cache.\n";
}
